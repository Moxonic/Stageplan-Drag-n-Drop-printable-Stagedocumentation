<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>
    <style>
        h1 {
            margin: auto;
            text-align: center;
            margin-bottom: 20px;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: gray;
        }
        .docBody {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width:80vW;
            margin:auto;
        }
        form {

            width: 90%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border-width: 3px;
            border-radius: 8px;
            padding: 5px;
            border:solid 2px #341efb;
        }
        p {
            margin-top: 20px;
        }
        .cameraButton{
            display: flex;
            font-size: xx-large;
            border-radius: 100%;
            width:50px;
            height:50px;
            align-items: center;
            justify-content: center;
            justify-self: center;
            padding-bottom: 15px;
            bottom: px;
            border-color: #4CAF50;
            border: 2px solid #4CAF50;

        }

        .pdfButton {
            border-radius: 5px; /* Rounded corners */
            margin: 10px auto; /* Center the button horizontally and add space above */
            padding: 10px; /* Button styling */
            background-color: #4CAF50; /* Button color */
            color: white; /* Text color */
            border: none; /* Remove border */
            display: block; /* Ensure the button is a block element */
            cursor: pointer; /* Pointer on hover */
            text-align: center; /* Center text */
        }

        .basicInfo label {
            display: flex;
            align-items: center;

        }
        .basicInfoContainer {

            display: flex;
            justify-content: space-between;
            gap: 5px;
            flex-direction: column;
            width:33%
        }

        .basicInfo {
            display: flex;
        }
        .linkButtonContainer{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        @media (max-width: 900px) {
            h1{
                left:0;
                right:0;
                width: 100vw;
            }

            body {
                margin: 0;
            }
            #stageForm {
                padding: 20px;
                margin: auto;
            }
            .docBody{
                margin: 0;
                padding: 0;
                width: 100vw;
                border-radius: 0%;
            }
            .basicInfoContainer {
                width: 100%;
                align-items: center;
            }
            .basicInfo {
                display: flex;
                width:100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

        <button class='cameraButton' type="button" onclick="document.querySelector('input[type=file]').click()">

        <hr>

        <button class='cameraButton' type="button" onclick="document.querySelector('input[type=file]').click()">

        <hr>

        <div class="linkButtonContainer">
            <button class='pdfButton' type="button" onclick="generatePDF()">Export PDF</button>

    </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script>
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.text("Stage Setup", 10, 10);
            doc.text("Show title: " + document.getElementById('showTitle').value, 10, 20);
            doc.text("Director: " + document.getElementById('director').value, 10, 30);
            doc.text("Opening date: " + document.getElementById('openingDate').value, 10, 40);
            doc.text("Stage: " + document.getElementById('stage').value, 10, 50);

            // Add more text and tables as needed
            const showTitle = document.getElementById('showTitle').value;
            doc.save(`Rig-${showTitle}.pdf`);
        }

        function addRowIfNeeded(tableId) {
            const table = document.getElementById(tableId);
            const lastRow = table.rows[table.rows.length - 1];
            const inputs = lastRow.querySelectorAll('input[type="text"]');
            let allFilled = true;

            inputs.forEach(input => {
                if (input.value.trim() === '') {
                    allFilled = false;
                }
            });

            if (allFilled) {
                const newRow = table.insertRow();
                inputs.forEach(input => {
                    const newCell = newRow.insertCell();
                    const newInput = document.createElement('input');
                    newInput.type = 'text';
                    newInput.name = input.name.replace(/\d+$/, '') + (table.rows.length - 1);
                    newCell.appendChild(newInput);
                });
                addEventListenersToInputs(newRow.querySelectorAll('input[type="text"]'));
            }
        }

        function addEventListenersToInputs(inputs) {
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    addRowIfNeeded(input.closest('table').id);
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault(); // Prevent form submission
                        addRowIfNeeded(input.closest('table').id);
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            addEventListenersToInputs(document.querySelectorAll('input[type="text"]'));
        });
    </script>
</body>
</html>
