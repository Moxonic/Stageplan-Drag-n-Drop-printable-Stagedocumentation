<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sceneplaner</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="main">
        <!-- Sidebar for predefined items -->
        <div id="sidebar">
            <input type="text" id="playNameInput" placeholder="Skriv forstillingstitelen her" />
            <div class="instructions">- Drag and drop equipment<br>
            - Rightclick turns items<br>
            - Doubleclick adds text</div>

            <div class="equipment-container">
                <!-- Existing equipment divs -->
                <div class="equipment" draggable="true" data-type="custom-speaker-cq">
                    <div class="cq"></div>
                </div>
                <div class="equipment" draggable="true" data-type="custom-speaker-vue">
                    <div class="vue"></div>
                </div>
                <div class="equipment" draggable="true" data-type="speaker">🔊</div>
                <div class="equipment" draggable="true" data-type="microphone">🎤</div>
                <div class="equipment" draggable="true" data-type="tv">📺</div>
            </div>

            <!-- Export Button -->
            <button id="export">Export as PDF</button>
        </div>

        <!-- Stage area where equipment will be placed -->
        <div class="stageContainer">
            <div id="stage">
                <div id="dropZone" class="drop-zone"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="dragnDrop.js"></script>
    <script src="addText.js"></script>
    <script src="printPDF.js"></script>
</body>
</html>
