<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sceneplaner</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="main">
        <!-- Sidebar for predefined items -->
        <div id="sidebar">
            <div class="header">
                SCENEPLANER LYD 
            </div>
            <div class="instructions">
                - Dra og slepp utstyr<br>
                - Dobbeltklikk legg til tekst<br>
                - Høgreklikk roterer element<br>
                - Klikk på "+" eller "-" for å endre størrelse<br>
                - Slette med dobbeltklikk
            </div>
            <input type="text" id="playNameInput" placeholder="skriv forstillingstitelen her" />

            <div class="equipment-container">
                <!-- Existing equipment divs -->
                <div class="equipment" draggable="true" data-type="custom-speaker-cq">
                    <div class="cq gear equipmentName">CQ</div>
                    <div class="gearText">CQ</div>
                </div>
                <div class="equipment" draggable="true" data-type="custom-speaker-vue">
                    <div class="vue gear equipmentName">VUE</div>
                    <div class="gearText">Vue 8a</div>
                </div>
                <div class="equipment" draggable="true" data-type="custom-speaker-vue">
                    <div class="vueOpp gear equipmentName">VUE</div>
                    <div class="gearText">Vue8a </div>
                </div>
                
                <div class="equipment gear" draggable="true" data-type="microphone">
                    🎤
                    <div class="gearText">Vue8a </div>
                </div>
                <div class="equipment gear" draggable="true" data-type="tv">
                    📺
                    <div class="gearText">Vue8a </div>
                </div>
                
            </div>
            <!-- Toggle Background Button -->
            <label>
                <input type="checkbox" id="toggleHSCPlan" checked>
                Vis HSC-kart
            </label>
            

            <!-- Export Button -->
            <button id="export">Eksporter PDF</button>
            <a href="riggDoku.html" id="rigDokuLink"> Rigg-Doku</a>

        </div>

        <!-- Stage area where equipment will be placed -->
        <div class="stageContainer">
            <div id="stage">
                
                <div id="dropZone" class="drop-zone">
                    <canvas id="canvas"/>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="dragnDrop.js"></script>
    <script src="addText.js"></script>
    <script src="drawRectangles.js"></script>
    <script src="toggleHSCplan.js"></script>
    <script src="printPDF.js"></script>
    <script src="zoom.js"></script>
</body>
</html>
